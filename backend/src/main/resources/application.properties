spring.application.name=taskflow-backend
server.port=${PORT:8080}
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:taskflow}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
# Comma-separated exact browser origins; never use a wildcard with credentialed requests.
taskflow.cors.allowed-origins=${TASKFLOW_CORS_ALLOWED_ORIGINS:http://localhost:3000}
taskflow.cookie.secure=${TASKFLOW_COOKIE_SECURE:true}
taskflow.session.days=${TASKFLOW_SESSION_DAYS:7}
taskflow.seed-demo=${TASKFLOW_SEED_DEMO:false}
